# OSV-Scanner configuration.
#
# Accepted, justified vulnerability exceptions. Each entry is a deliberate risk
# decision, not a silent suppression: no fix inside the range the dependent
# package allows (or no fix at all), build-time or dev-only reach, and no
# untrusted input. Revisit on each release.

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
# katex 0.16.47, CVSS 2.1 (low). Pulled in only by mermaid (via
